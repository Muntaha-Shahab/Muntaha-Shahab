<text x="40" y="268" font-size="14" xml:space="preserve" class="a" style="animation-delay:2.1s"><tspan fill="#9ca3af">Starting development server at </tspan><tspan fill="#22d3ee">http://127.0.0.1:8000/</tspan></text>
