.cur{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<g clip-path="url(#clip)">
<rect width="900" height="400" fill="url(#bg)"/>
<circle cx="780" cy="40" r="280" fill="url(#g1)"/>
<circle cx="60" cy="390" r="260" fill="url(#g2)"/>
