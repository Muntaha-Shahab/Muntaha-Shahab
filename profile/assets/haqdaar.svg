<svg xmlns="http://www.w3.org/2000/svg" width="840" height="316" viewBox="0 0 840 316" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','Fira Code',Consolas,Menlo,monospace">
<defs>
<linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
</defs>
<style>@keyframes pulse{50%{opacity:.25}}</style>
<rect x="0.5" y="0.5" width="839" height="315" rx="16" fill="#0f1623" stroke="#1f2937"/>
<line x1="20" y1="1.5" x2="820" y2="1.5" stroke="url(#hg)" stroke-width="3" stroke-linecap="round"/>
<text x="32" y="58" font-size="28" font-weight="700" fill="url(#hg)">HaqDaar</text>
<text x="170" y="58" font-size="15" fill="#9ca3af">AI-Powered Legal Aid Platform</text>
<rect x="640" y="34" width="168" height="28" rx="14" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.5"/>
<circle cx="660" cy="48" r="4" fill="#34d399" style="animation:pulse 1.6s ease-in-out infinite"/>
<text x="673" y="52" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1">IN DEVELOPMENT</text>
<text x="32" y="86" font-size="12" fill="#6b7280">Final year project  ·  Team of 3  ·  Urdu / English</text>
<text x="32" y="122" font-size="14" fill="#d1d5db">Helps citizens in Pakistan understand their legal rights and connect</text>
<text x="32" y="142" font-size="14" fill="#d1d5db">with volunteer lawyers and NGOs.</text>
<line x1="32" y1="164" x2="808" y2="164" stroke="#1f2937"/>
<text x="32" y="186" font-size="11" fill="#22d3ee" letter-spacing="2">WHAT I BUILT</text>
<circle cx="37" cy="202" r="3" fill="#22d3ee"/><text x="50" y="206" font-size="13" fill="#9ca3af">Admin citizen APIs: search, filters, block/unblock, soft delete, CSV export, audit log</text><circle cx="37" cy="224" r="3" fill="#22d3ee"/><text x="50" y="228" font-size="13" fill="#9ca3af">PostgreSQL models for citizens and cases, JWT auth between Next.js and Django REST</text><circle cx="37" cy="246" r="3" fill="#22d3ee"/><text x="50" y="250" font-size="13" fill="#9ca3af">Migrated a 240-file frontend to Next.js, review pull requests, manage the GitHub org</text>
<rect x="32" y="276" width="69" height="24" rx="12" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/><text x="66.5" y="292" font-size="12" fill="#34d399" text-anchor="middle">Django</text><rect x="109" y="276" width="180" height="24" rx="12" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/><text x="199.0" y="292" font-size="12" fill="#34d399" text-anchor="middle">Django REST Framework</text><rect x="297" y="276" width="98" height="24" rx="12" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.45"/><text x="346.0" y="292" font-size="12" fill="#fbbf24" text-anchor="middle">PostgreSQL</text><rect x="403" y="276" width="46" height="24" rx="12" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.45"/><text x="426.0" y="292" font-size="12" fill="#f472b6" text-anchor="middle">JWT</text><rect x="457" y="276" width="76" height="24" rx="12" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.45"/><text x="495.0" y="292" font-size="12" fill="#a78bfa" text-anchor="middle">Next.js</text><rect x="541" y="276" width="113" height="24" rx="12" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.45"/><text x="597.5" y="292" font-size="12" fill="#a78bfa" text-anchor="middle">Tailwind CSS</text>
